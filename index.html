<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Protocol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <h1 class="text-center">Trading Protocol</h1>

                <div class="card mt-4 p-4">
                    <p id="question" class="fs-5"></p>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="answer" id="yesOption" value="yes">
                        <label class="form-check-label" for="yesOption">Yes</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="answer" id="noOption" value="no">
                        <label class="form-check-label" for="noOption">No</label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button onclick="prevQuestion()" class="btn btn-secondary" id="prevBtn"
                            disabled>Previous</button>
                        <button onclick="checkAnswer()" class="btn btn-primary">Submit</button>
                    </div>

                    <div class="card mt-4">
                        <div class="card-body">
                            <h5 class="card-title text-center">Macro Tijden per Uur</h5>
                            <p class="text-muted text-center">Elke uur heeft een macro</p>

                            <h6 class="mt-4">🕗 AM</h6>
                            <ul class="list-group list-group-flush mb-3">
                                <li class="list-group-item">Macro tijd: <strong>09:45 - 10:15</strong></li>
                                <li class="list-group-item">Macro tijd: <strong>10:45 - 11:15</strong></li>
                            </ul>

                            <h6>🕑 PM</h6>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item">Macro tijd: <strong>13:45 - 14:15</strong></li>
                                <li class="list-group-item">Macro tijd: <strong>14:45 - 15:15</strong></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div id="result" class="mt-4 fs-4 text-center"></div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { question: "Is er PPI/CPI/NFP/FOMC vandaag?", answer: "no" },
            { question: "Kijk naar de 729 en 243(Forex 243/81/27) op de 1HTF en schrijf op wat je ziet. Zijn we in Premium of Discount en/of zie je AMD.", answer: "yes" },
            { question: "Identifceer liquidity binnen de HTF dealing range, Markeer de previous session en daily lows en highs.", answer: "yes" },
            { question: "Identificeer de HTF PD Arrays in de Dealing Range", answer: "yes" },
            { question: "Is er SMT op de HTF", answer: "yes" },
            { question: "Is de HTF Orderflow en de DOL duidelijk?", answer: "yes" },
            { question: "Identificeer je POI en schakel daarna pas naar de LTF en de 81/243 Forex(27/81)", answer: "yes" },
            { question: "Identificeer de PD arrays op de LTF keylevels en wacht tot we tijdens de Macro Time in je POI zitten", answer: "yes" },
            { question: "Hebben we op de LTF SMT?", answer: "yes" },
            { question: "Is je setup present", answer: "yes" },
        ];

        let currentQuestion = 0;
        let userAnswers = new Array(questions.length).fill("");

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById("question").textContent = q.question;
            document.getElementById("result").textContent = "";

            // Clear radio selection
            document.querySelectorAll('input[name="answer"]').forEach(el => el.checked = false);

            // Restore previous answer if it exists
            if (userAnswers[currentQuestion]) {
                document.querySelector(`input[name="answer"][value="${userAnswers[currentQuestion]}"]`).checked = true;
            }

            document.getElementById("prevBtn").disabled = currentQuestion === 0;
        }

        function checkAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                document.getElementById("result").innerHTML = `<span class="text-danger">Please select an answer.</span>`;
                return;
            }

            const userInput = selected.value;
            userAnswers[currentQuestion] = userInput;

            if (userInput === questions[currentQuestion].answer) {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    loadQuestion();
                } else {
                    document.querySelector(".card").style.display = "none";
                    document.getElementById("result").innerHTML = `<span class="text-success">Trade en journal deze trade</span>`;
                }
            } else if (currentQuestion === 4) {
                document.getElementById("result").innerHTML = `<span class="text-danger">Wacht totdat er een SMT is op de HTF.</span>`;
            }

            else if (currentQuestion === 5) {
                document.getElementById("result").innerHTML = `<span class="text-danger">Wacht met traden tot de HTF Orderflow en de DOL duidelijk is of loop weg.</span>`;
            }

            else if (currentQuestion === 8) {
                document.getElementById("result").innerHTML = `<span class="text-danger">Wacht totdat er een SMT is op de LTF of loop weg.</span>`;
            }

            else {
                document.getElementById("result").innerHTML = `<span class="text-danger">Loop weg niet traden</span>`;
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        window.onload = loadQuestion;
    </script>
</body>

</html>
